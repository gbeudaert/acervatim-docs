# Configuration Jekyll pour GitHub Pages.
# Theme : just-the-docs (charge via jekyll-remote-theme, supporte par GitHub Pages).
# Ce depot est la documentation centrale Acervatim : espaces Utilisateur / Developpeur + Legal.

title: Acervatim
description: >-
  Documentation centrale d'Acervatim : application Android de gestion de
  collections (vinyles et mangas, puis films, LEGO et jeux de societe), 100 %
  hors-ligne par defaut, avec un mode connecte optionnel d'enrichissement de
  metadonnees.
lang: fr

remote_theme: just-the-docs/just-the-docs
plugins:
  - jekyll-remote-theme

search_enabled: true
heading_anchors: true
color_scheme: light

# Liens de navigation auxiliaires (coin superieur droit).
aux_links:
  "Application (acervatim-app)": "https://github.com/gbeudaert/acervatim-app"
  "Backend (acervatim-backend)": "https://github.com/gbeudaert/acervatim-backend"
  "Micro-services (acervatim-services)": "https://github.com/gbeudaert/acervatim-services"

footer_content: >-
  Acervatim - documentation centrale. Application sous licence Apache 2.0.

# Documents de travail / plan / doc agent IA, non publies comme pages du site.
exclude:
  - agent/
  - AGENTS.md
  - CLAUDE.md
  - _bmad/
  - _bmad-output/
  - plan-consolidation-documentation.md
  - sprints-conformite-offre.md
  - spec-macro-partage-collection.md
  - spec-macro-recherche-tris-galerie.md
  - spec-macro-export-sources-externes.md
  - spec-macro-import-serie-manga.md
  - spec-repli-google-books-pivot.md
  - audit-limitations-recherche-manga.md
  - etude-leviers-recherche-manga.md
  - dossier-jeux-de-societe-bgg-gameupc.md
  - private/
  - vendor/
  - Gemfile
  - Gemfile.lock
  - README.md
